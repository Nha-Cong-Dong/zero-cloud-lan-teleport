# Build thử bản GUI Teleport (Teleport.exe, windowed) cho Windows bằng PyInstaller (--onedir) rồi chạy
# test khói trên exe; sau đó đóng bộ cài bằng Inno Setup (packaging/inno/teleport.iss) và chạy test
# cài/gỡ trên bộ cài. Hai artifact riêng với bản CLI (build-cli.yml): zip thư mục dist và file bộ cài.
# Chỉ chạy tay (workflow_dispatch); không gắn tag, không tạo Release, không dùng secret, không ký mã.
# Artifact là bản tạm (giữ 14 ngày), không phải bản phát hành.
name: Build GUI (thử)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: windows-latest / Python 3.12.10
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Inno Setup ghim đúng bản đã duyệt giấy phép (docs/ke_hoach.md mục 1, Giấy phép; văn bản ở
      # packaging/inno/licenses/). Tải từ GitHub Release chính thức của jrsoftware/issrc và kiểm SHA-256
      # trước khi chạy. Nâng bản: đọc lại giấy phép, thay license và Vietnamese.isl đúng tag mới, sửa
      # ba dòng này cùng lúc.
      INNO_VERSION: "6.7.3"
      INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
      INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          # Ghim đúng bản vá như build-cli.yml (CPYTHON_LICENSE_TEXTS trong third_party.py).
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/pyinstaller/requirements.txt
            packaging/pyinstaller/constraints.txt
      - name: Cài dependency và công cụ build
        # Extra gui kéo PySide6-Essentials; nâng PySide6 thì third_party.py dừng build cho tới khi rà
        # lại thành phần lồng trong Qt (QT_LICENSE_VERSION). constraints.txt ghim bản dependency runtime
        # được đóng vào exe (cryptography, zeroconf, PySide6-Essentials, ...), nên PyPI ra bản PySide6 mới
        # không làm hỏng build.
        run: python -m pip install -e ".[dev]" -r packaging/pyinstaller/requirements.txt -c packaging/pyinstaller/constraints.txt
      - name: Build bằng PyInstaller
        env:
          PYTHONUTF8: "1"
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/pyinstaller/teleport-gui.spec
      - name: Lấy phiên bản và commit
        id: meta
        shell: bash
        run: |
          version="$(python -c 'import teleport; print(teleport.__version__)')"
          # Số phiên bản 4 phần cho VERSIONINFO của bộ cài: phần release của PEP 440, đệm 0 đủ 4 số
          # (0.1.0a0 -> 0.1.0.0); AppVersion vẫn là chuỗi gốc.
          numeric="$(python -c '
          import teleport
          from packaging.version import Version
          release = list(Version(teleport.__version__).release)
          assert len(release) <= 4, release
          print(".".join(str(n) for n in release + [0] * (4 - len(release))))
          ')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "version_numeric=${numeric}" >> "$GITHUB_OUTPUT"
          echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Test khói trên exe (pytest -m frozen)
        env:
          TELEPORT_FROZEN_GUI_EXE: ${{ github.workspace }}\dist\teleport-gui\Teleport.exe
        run: pytest -m frozen -v
      - name: Kiểm nội dung dist và ghi kích thước
        # Artifact lấy cả dist/ để zip có thư mục bọc teleport-gui\ (giải nén ra một thư mục, không rải
        # file); vì vậy dist/ chỉ được có đúng thư mục đó, cạnh Teleport.exe phải có DOC-TRUOC.txt.
        shell: pwsh
        run: |
          $top = @(Get-ChildItem dist -Force | ForEach-Object Name)
          if (($top -join ',') -ne 'teleport-gui') { throw "dist/ phải chỉ có teleport-gui, đang có: $($top -join ', ')" }
          foreach ($name in 'Teleport.exe', 'DOC-TRUOC.txt', 'LICENSE', 'THIRD-PARTY-NOTICES.txt', 'SOURCE.txt') {
            if (-not (Test-Path -LiteralPath "dist/teleport-gui/$name" -PathType Leaf)) { throw "thiếu dist/teleport-gui/$name" }
          }
          $bytes = (Get-ChildItem dist/teleport-gui -Recurse -File | Measure-Object Length -Sum).Sum
          "Thư mục dist/teleport-gui: {0:N1} MB" -f ($bytes / 1MB) >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: teleport-gui-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha7 }}-windows
          # Một thư mục thì nó là gốc của zip: zip chứa teleport-gui\Teleport.exe, teleport-gui\_internal\...
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - name: Cài Inno Setup (bản ghim, kiểm SHA-256)
        # Cài vào thư mục riêng trong RUNNER_TEMP và gọi ISCC bằng đường dẫn đầy đủ, để không dùng nhầm
        # bản Inno Setup có sẵn trên runner.
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION.exe"
          $dir = Join-Path $env:RUNNER_TEMP "inno-$env:INNO_VERSION"
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $setup
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          if ($hash -ne $env:INNO_SHA256) { throw "SHA-256 của bộ cài Inno Setup sai: $hash" }
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$dir`"")
          if ($p.ExitCode -ne 0) { throw "Cài Inno Setup lỗi, mã $($p.ExitCode)" }
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw "không thấy $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Build bộ cài bằng Inno Setup
        # Ra installer/ (ngoài dist/, vì artifact zip lấy cả dist/). Phiên bản lấy từ teleport.__version__.
        shell: pwsh
        run: |
          & $env:ISCC `
            "/DAppVersion=${{ steps.meta.outputs.version }}" `
            "/DAppVersionNumeric=${{ steps.meta.outputs.version_numeric }}" `
            "/DSourceDir=$PWD\dist\teleport-gui" `
            "/O$PWD\installer" `
            packaging\inno\teleport.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC lỗi, mã $LASTEXITCODE" }
      - name: Kiểm cỡ bộ cài và ghi kích thước
        # Ngưỡng là cỡ bộ cài Windows ở mvp N11 (MB = 10^6 byte). Vượt thì dừng, không tải artifact.
        shell: pwsh
        run: |
          $files = @(Get-ChildItem installer -File)
          if ($files.Count -ne 1) { throw "installer/ phải có đúng một file, đang có: $($files.Name -join ', ')" }
          $exe = $files[0]
          "Bộ cài $($exe.Name): {0:N2} MiB ({1} B)" -f ($exe.Length / 1MB), $exe.Length >> $env:GITHUB_STEP_SUMMARY
          if ($exe.Length -gt 80000000) { throw "Bộ cài $($exe.Length) B vượt ngưỡng mvp N11 (80 000 000 B)" }
          "TELEPORT_INSTALLER_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Test cài/gỡ trên bộ cài (pytest -m frozen)
        # Runner chạy với quyền admin nên test cài cho cả máy và rule tường lửa cũng chạy.
        run: pytest tests/packaging/test_installer.py -m frozen -v
      - uses: actions/upload-artifact@v4
        with:
          name: teleport-gui-setup-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha7 }}-windows
          path: installer/
          retention-days: 14
          if-no-files-found: error
