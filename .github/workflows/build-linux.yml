# Build gói AppImage cho Linux bằng packaging/linux/build-appimage.sh.
# Chạy tay (workflow_dispatch) hoặc được release.yml gọi lại (workflow_call).
name: Build Linux AppImage

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ""
    outputs:
      artifact:
        description: Tên artifact chứa file AppImage
        value: ${{ jobs.build-linux.outputs.artifact }}

permissions:
  contents: read

jobs:
  build-linux:
    name: ubuntu-24.04 / Python 3.12.10
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact: teleport-appimage-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha7 }}-linux
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/pyinstaller/requirements.txt
            packaging/pyinstaller/constraints.txt
      - name: Cài đặt thư viện hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3 libfuse2t64 fuse file
      - name: Cài đặt dependencies Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" -r packaging/pyinstaller/requirements.txt
      - name: Lấy phiên bản và commit
        id: meta
        shell: bash
        run: |
          version="$(python -c 'import teleport; print(teleport.__version__)')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build AppImage
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          bash packaging/linux/build-appimage.sh
      - name: Kiểm tra file AppImage đã tạo
        shell: bash
        run: |
          ls -lh dist/
          test -f dist/Teleport-${{ steps.meta.outputs.version }}-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: teleport-appimage-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha7 }}-linux
          path: dist/Teleport-*-x86_64.AppImage
          retention-days: 14
          if-no-files-found: error
