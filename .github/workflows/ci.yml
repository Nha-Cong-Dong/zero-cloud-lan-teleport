name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Push commit mới vào cùng PR thì hủy lần chạy cũ; trên main mỗi commit vẫn chạy đủ.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Phân loại phạm vi thay đổi
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "changes: push -> code=true"
            exit 0
          fi
          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
          if [ -z "$files" ]; then
            # Không đọc được danh sách tệp -> chạy đủ CI để không bỏ sót kiểm tra.
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "changes: empty file list -> code=true"
            exit 0
          fi
          code="false"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              # Các tệp đặc tả/quy trình mà bộ test đọc trực tiếp phải luôn kích hoạt đầy đủ CI.
              docs/product/mvp.md|docs/mvp.md|\
              docs/technical/architecture.md|docs/architecture.md|\
              docs/technical/protocol.md|docs/protocol.md|\
              docs/community/CHANGELOG.md|docs/CHANGELOG.md|\
              docs/community/CONTRIBUTING.md|docs/CONTRIBUTING.md)
                code="true"
                break
                ;;
              README.md|GEMINI.md|gemini.md|.gitattributes|.agents/*|docs/*)
                ;;
              *)
                code="true"
                break
                ;;
            esac
          done <<< "$files"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "changes: pull_request #${PR_NUMBER} -> code=${code}"

  lint:
    name: Lint & Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: lint-3.12
      # Cần PySide6 để mypy kiểm tầng ui, nhưng không cài pytest-qt (nạp libEGL.so.1 lúc khởi động pytest).
      - run: uv pip install --system -e ".[dev-core,gui]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: python packaging/i18n/update.py --check
      - run: pytest -q -p no:qt tests/test_architecture.py

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.12", "3.14"]
        # Hai job chạy cùng lúc: test giao diện tách riêng (vì sao: architecture.md mục 6), nên thời
        # gian chờ một PR là job dài hơn chứ không phải tổng hai bộ.
        suite: [core, gui]
        # Test giao diện trên Windows chạy tuần tự (dưới đây), nên chia làm ba phần chạy cùng lúc.
        exclude:
          - os: windows-latest
            suite: gui
        include:
          - {os: windows-latest, python: "3.12", suite: gui, shard: 1/3}
          - {os: windows-latest, python: "3.12", suite: gui, shard: 2/3}
          - {os: windows-latest, python: "3.12", suite: gui, shard: 3/3}
          - {os: windows-latest, python: "3.14", suite: gui, shard: 1/3}
          - {os: windows-latest, python: "3.14", suite: gui, shard: 2/3}
          - {os: windows-latest, python: "3.14", suite: gui, shard: 3/3}
    env:
      # Test tầng ui chạy Qt không cần màn hình.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: py-${{ matrix.python }}-${{ matrix.suite }}
      # Thư viện hệ thống mà Qt cần với nền offscreen (chỉ cần ở suite gui).
      - if: runner.os == 'Linux' && matrix.suite == 'gui'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      # Suite core không kéo PySide6/pytest-qt (tests/packaging chạy ở suite gui nơi có sẵn PySide6).
      - if: matrix.suite == 'core'
        run: uv pip install --system -e ".[dev-core]"
      - if: matrix.suite == 'gui'
        run: uv pip install --system -e ".[dev]"
      # Song song theo số lõi của runner; test marker mdns dồn vào một worker (tests/conftest.py).
      # Worker crash thì dừng ngay: xdist chạy lại test vừa crash ở worker mới và từng treo tới hết
      # timeout-minutes.
      - if: matrix.suite == 'core'
        run: pytest -q -n auto --dist loadgroup --max-worker-restart=0 --ignore=tests/ui --ignore=tests/packaging
      # Test tests/ui không chạy chung lần chạy với test tầng khác, và trên Windows chạy tuần tự: trong
      # worker xdist, vòng sự kiện Qt từng abort (chưa rõ nguyên nhân; architecture.md mục 6).
      # tests/packaging dùng PySide6 (lrelease, kiểm giấy phép Qt) nên chạy cùng suite gui trên mọi OS.
      - if: matrix.suite == 'gui' && runner.os != 'Windows'
        run: pytest -q -n auto --dist loadgroup --max-worker-restart=0 tests/ui tests/packaging
      - if: matrix.suite == 'gui' && runner.os == 'Windows'
        run: pytest -q tests/ui tests/packaging
        env:
          TELEPORT_SHARD: ${{ matrix.shard }}

  ci-gate:
    name: CI Gate
    needs: [changes, lint, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kiểm tra trạng thái tổng hợp CI
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          echo "changes=${CHANGES_RESULT} (code=${CODE_CHANGED}), lint=${LINT_RESULT}, test=${TEST_RESULT}"
          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo "::error::Job changes thất bại (${CHANGES_RESULT})."
            exit 1
          fi
          if [ "${CODE_CHANGED}" != "true" ]; then
            echo "PR chỉ sửa tài liệu không nằm trong kiểm thử — bỏ qua bộ test."
            exit 0
          fi
          if [ "${LINT_RESULT}" != "success" ] || [ "${TEST_RESULT}" != "success" ]; then
            echo "::error::CI không đạt (lint=${LINT_RESULT}, test=${TEST_RESULT})."
            exit 1
          fi
