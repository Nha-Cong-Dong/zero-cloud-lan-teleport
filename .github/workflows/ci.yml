name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Push commit mới vào cùng PR thì hủy lần chạy cũ; trên main mỗi commit vẫn chạy đủ.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.12", "3.14"]
        # Hai job chạy cùng lúc: test giao diện tách riêng (vì sao: architecture.md mục 6), nên thời
        # gian chờ một PR là job dài hơn chứ không phải tổng hai bộ.
        suite: [core, gui]
        # Test giao diện trên Windows chạy tuần tự (dưới đây), nên chia làm ba phần chạy cùng lúc.
        exclude:
          - os: windows-latest
            suite: gui
        include:
          - {os: windows-latest, python: "3.12", suite: gui, shard: 1/3}
          - {os: windows-latest, python: "3.12", suite: gui, shard: 2/3}
          - {os: windows-latest, python: "3.12", suite: gui, shard: 3/3}
          - {os: windows-latest, python: "3.14", suite: gui, shard: 1/3}
          - {os: windows-latest, python: "3.14", suite: gui, shard: 2/3}
          - {os: windows-latest, python: "3.14", suite: gui, shard: 3/3}
    env:
      # Test tầng ui chạy Qt không cần màn hình.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Thư viện hệ thống mà Qt cần với nền offscreen (libxkbcommon-x11-0 chỉ cần cho nền xcb).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[dev,gui]"
      - if: matrix.suite == 'core'
        run: ruff check .
      - if: matrix.suite == 'core'
        run: ruff format --check .
      - if: matrix.suite == 'core'
        run: mypy src
      # Song song theo số lõi của runner; test marker mdns dồn vào một worker (tests/conftest.py).
      # Worker crash thì dừng ngay: xdist chạy lại test vừa crash ở worker mới và từng treo tới hết
      # timeout-minutes.
      - if: matrix.suite == 'core'
        run: pytest -q -n auto --dist loadgroup --max-worker-restart=0 -m "not gui"
      # Test tests/ui không chạy chung lần chạy với test tầng khác, và trên Windows chạy tuần tự: trong
      # worker xdist, vòng sự kiện Qt từng abort (chưa rõ nguyên nhân; architecture.md mục 6).
      - if: matrix.suite == 'gui' && runner.os != 'Windows'
        run: pytest -q -n auto --dist loadgroup --max-worker-restart=0 -m gui
      - if: matrix.suite == 'gui' && runner.os == 'Windows'
        run: pytest -q -m gui
        env:
          TELEPORT_SHARD: ${{ matrix.shard }}
