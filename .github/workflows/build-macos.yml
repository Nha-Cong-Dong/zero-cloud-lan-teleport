# Build file .dmg cho macOS bằng packaging/macos/build-dmg.sh.
# Chạy tay (workflow_dispatch) hoặc được release.yml gọi lại (workflow_call).
name: Build macOS DMG

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ""
    outputs:
      artifact:
        description: Tên artifact chứa file .dmg
        value: ${{ jobs.build-macos.outputs.artifact }}

permissions:
  contents: read

jobs:
  build-macos:
    name: macos-latest / Python 3.12.10
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      artifact: teleport-dmg-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha7 }}-macos
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/pyinstaller/requirements.txt
            packaging/pyinstaller/constraints.txt
      - name: Cài đặt dependencies Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" -r packaging/pyinstaller/requirements.txt
      - name: Lấy phiên bản và commit
        id: meta
        shell: bash
        run: |
          version="$(python -c 'import teleport; print(teleport.__version__)')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build DMG
        shell: bash
        run: |
          bash packaging/macos/build-dmg.sh
      - name: Kiểm tra file DMG đã tạo
        shell: bash
        run: |
          ls -lh dist/
          test -f dist/Teleport-${{ steps.meta.outputs.version }}-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: teleport-dmg-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha7 }}-macos
          path: dist/Teleport-*-macOS.dmg
          retention-days: 14
          if-no-files-found: error
