name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Push commit mới vào cùng PR thì hủy lần chạy cũ; trên main mỗi commit vẫn chạy đủ.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.12", "3.14"]
    env:
      # Test tầng ui chạy Qt không cần màn hình.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Thư viện hệ thống mà Qt cần với nền offscreen (libxkbcommon-x11-0 chỉ cần cho nền xcb).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[dev,gui]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      # Song song theo số lõi của runner, trừ test tests/ui; test marker mdns dồn vào một worker
      # (tests/conftest.py). Worker crash thì dừng ngay: xdist chạy lại test vừa crash ở worker mới
      # và từng treo tới hết timeout-minutes.
      - run: pytest -q -n auto --dist loadgroup --max-worker-restart=0 -m "not gui"
      # Test tests/ui chạy tuần tự ở tiến trình riêng: trong worker xdist đã chạy test khác, vòng sự
      # kiện Qt từng abort (Windows, chưa rõ nguyên nhân; architecture.md mục 6).
      - run: pytest -q -m gui
