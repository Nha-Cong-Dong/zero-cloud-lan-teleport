[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Tên bản phân phối khác tên import (`teleport`) để không trùng gói "teleport" sẵn có trên PyPI.
name = "zero-cloud-lan-teleport"
dynamic = ["version"]
description = "Zero-Cloud LAN Teleport — chuyển file và clipboard trực tiếp trong mạng LAN"
readme = "README.md"
# PEP 639: wheel chứa cả icon Fluent UI System Icons (MIT) và font Bricolage Grotesque (OFL-1.1, đóng
# nguyên dạng file dữ liệu riêng) trong teleport/ui/assets/; docs/ke_hoach.md mục 1 (Giấy phép).
license = "GPL-3.0-or-later AND MIT AND OFL-1.1"
license-files = ["LICENSE", "src/teleport/ui/assets/icons/LICENSE", "src/teleport/ui/assets/fonts/OFL.txt"]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42",
    # LGPL-2.1-or-later. Chặn trên có chủ đích: code dựa vào hành vi nội bộ của zeroconf
    # (TTL PTR tối thiểu 1125 s, cách parse TXT; `out_queue` / `out_delay_queue` và cache khi gỡ và
    # đăng ký lại dịch vụ, docstring `net/discovery.py`), nên chỉ nâng sau khi đã kiểm lại.
    "zeroconf>=0.148,<0.152",
    "ifaddr>=0.2",  # MIT
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=2.4",  # MIT
    "pytest-qt>=4.4",  # MIT
    "pytest-xdist>=3.6",  # MIT; CI chạy pytest song song (-n auto --dist loadgroup)
    # pytest-qt cần một binding Qt lúc cấu hình, nên dev kéo luôn extra gui.
    "zero-cloud-lan-teleport[gui]",
]
# Giao diện đồ họa (`teleport-gui`, tầng `ui`). Chỉ `ui` import PySide6.
gui = [
    # PySide6-Essentials và shiboken6: LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only; dùng theo LGPL-3.0
    # (docs/ke_hoach.md mục 1, Giấy phép: đóng gói --onedir để người dùng thay được).
    # Sàn 6.10.1: bản thấp nhất có wheel cho Python 3.14 (6.10.0 ghi requires-python <3.14).
    "PySide6-Essentials>=6.10.1,<7",
]

[project.scripts]
teleport = "teleport.cli:main"

[project.gui-scripts]
teleport-gui = "teleport.ui.app:main"

[project.urls]
Repository = "https://github.com/Nha-Cong-Dong/zero-cloud-lan-teleport"

[tool.setuptools.dynamic]
version = { attr = "teleport.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Bản dịch đã biên dịch (thư mục chưa có file nào thì glob không khớp gì, build vẫn chạy); icon SVG và font
# của ui kèm file giấy phép của chúng (assets/ không có __init__.py, đọc qua importlib.resources).
"teleport.ui" = [
    "i18n/*.qm",
    "assets/icons/*.svg",
    "assets/icons/LICENSE",
    "assets/fonts/*.ttf",
    "assets/fonts/OFL.txt",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003: cho phép ký tự Unicode tiếng Việt trong chuỗi, comment và docstring.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
# Kiểm theo phiên bản Python thấp nhất được hỗ trợ (requires-python), để không lỡ dùng API mới hơn.
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Không bật ignore_missing_imports: cryptography, zeroconf, ifaddr và PySide6 đều kèm py.typed. Thư viện
# thiếu stub về sau thì thêm override riêng cho đúng module đó, đừng tắt kiểm tra cho mọi import.

[[tool.mypy.overrides]]
# core là logic thuần, nơi kiểu dữ liệu đáng tin nhất: mọi hàm phải có chú thích kiểu.
module = ["teleport.core.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ chia thư mục theo tầng (core/, trust/, net/…); importlib cho phép trùng tên file giữa các thư mục.
addopts = "--import-mode=importlib"
# Không có __init__.py nên file test không import lẫn nhau; helper dùng chung nằm ở tests/support.py.
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: cần socket thật trên 127.0.0.1 (bỏ qua bằng -m 'not integration')",
    "slow: chạy quá 1 giây (vòng lặp nhanh: -m 'not slow'; CI vẫn chạy đủ)",
    "gui: test tầng ui, cần PySide6 và chạy với QT_QPA_PLATFORM=offscreen",
    "mdns: mDNS thật trên 127.0.0.1 (bỏ qua bằng TELEPORT_SKIP_MDNS=1; khi chạy song song dồn vào một worker)",
    "frozen: chạy bản build PyInstaller trỏ bởi TELEPORT_FROZEN_EXE (CLI) / TELEPORT_FROZEN_GUI_EXE (GUI), hoặc bộ cài trỏ bởi TELEPORT_INSTALLER_EXE; không có thì bỏ qua",
]
